# =============================================================================
# StarIsland — iOS Build & CI Pipeline
# =============================================================================
# Triggers:
#   push / pull_request   → Build Verification (Debug, no signing)
#   workflow_dispatch     → Build + unsigned IPA (Release, no signing needed)
#
# Branch strategy:
#   develop     → daily dev
#   release/*   → RC builds
#   main        → stable releases
#
# IPA is unsigned — AltStore / SideStore re-signs on device during install.
# No code signing secrets required.
# =============================================================================
name: iOS Build

on:
  push:
    branches: [main, develop, release/**]
  pull_request:
    branches: [main, develop, release/**]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: StarIsland
  SCHEME: StarIsland

jobs:
  # ── Job 1: Build Verification — every push & PR ──────────────────────────
  build:
    name: Build Verification
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Run Build Diagnostic
        run: |
          chmod +x Scripts/ci-diagnose.sh
          ./Scripts/ci-diagnose.sh
        continue-on-error: true

      - name: Upload Diagnostic Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-log
          path: diagnostic.log
          retention-days: 30

      - name: Build (Debug, No Signing)
        run: |
          xcodebuild clean build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 30

  # ── Job 2: Unsigned IPA — workflow_dispatch only ─────────────────────────
  # Builds a Release .app, packages into Payload/StarIsland.app → .ipa
  # No code signing needed — AltStore/SideStore signs on-device.
  release:
    name: Unsigned IPA
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (latest stable)
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Release .app (No Signing)
        run: |
          xcodebuild clean build \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee build-release.log

      - name: Locate App Bundle
        id: locate-app
        run: |
          # Method 1: Read BUILT_PRODUCTS_DIR from xcodebuild settings (primary)
          BUILT_PRODUCTS_DIR=$(xcodebuild \
            -project "$PROJECT_NAME.xcodeproj" \
            -scheme "$SCHEME" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -showBuildSettings 2>&1 \
            | grep -E '^[[:space:]]+BUILT_PRODUCTS_DIR[[:space:]]+=' \
            | awk '{print $NF}')

          # Ensure it's a valid path
          if [ -z "$BUILT_PRODUCTS_DIR" ] || [ ! -d "$BUILT_PRODUCTS_DIR" ]; then
            # Method 2: Fallback — search DerivedData directly
            echo "⚠️  showBuildSettings lookup failed, searching DerivedData..."
            FOUND_APP=$(find ~/Library/Developer/Xcode/DerivedData \
              -path "*/Release-iphoneos/StarIsland.app" -type d \
              2>/dev/null | head -1)
            if [ -n "$FOUND_APP" ]; then
              BUILT_PRODUCTS_DIR="${FOUND_APP%/*}"
            fi
          fi

          # Validate
          if [ -z "$BUILT_PRODUCTS_DIR" ] || [ ! -d "$BUILT_PRODUCTS_DIR/StarIsland.app" ]; then
            echo "❌ ERROR: Cannot locate StarIsland.app after build"
            ls -la ~/Library/Developer/Xcode/DerivedData/ 2>/dev/null | head -20
            exit 1
          fi

          echo "BUILT_PRODUCTS_DIR=$BUILT_PRODUCTS_DIR" >> "$GITHUB_OUTPUT"
          echo "Found: $BUILT_PRODUCTS_DIR/StarIsland.app"

          # Diagnostics: list app bundle contents and size
          echo ""
          echo "===== App Bundle Content ====="
          find "$BUILT_PRODUCTS_DIR/StarIsland.app" | head -50
          du -sh "$BUILT_PRODUCTS_DIR/StarIsland.app"

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload

          APP_PATH="${{ steps.locate-app.outputs.BUILT_PRODUCTS_DIR }}/StarIsland.app"

          echo "APP_PATH=$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "❌ StarIsland.app not found"
            exit 1
          fi

          echo "===== Original app size ====="
          du -sh "$APP_PATH"

          # Apple-recommended way to copy a .app bundle
          ditto "$APP_PATH" "build/Payload/StarIsland.app"

          echo "===== Payload content ====="
          find build/Payload | head -50

          echo "===== Copied app size ====="
          du -sh build/Payload/StarIsland.app

          cd build
          zip -qry StarIsland.ipa Payload

          echo "===== IPA size ====="
          ls -lh StarIsland.ipa

      - name: Verify IPA Structure
        run: |
          echo "===== IPA content ====="
          unzip -l build/StarIsland.ipa | head -100

          echo ""
          echo "===== IPA size ====="
          ls -lh build/StarIsland.ipa

          echo ""
          echo "===== Payload tree ====="
          PAYLOAD_COUNT=$(unzip -l build/StarIsland.ipa | grep -c "Payload/StarIsland.app" || true)
          unzip -l build/StarIsland.ipa | grep Payload | head -50

          echo ""
          if [ "$PAYLOAD_COUNT" -eq 0 ]; then
            echo "❌ Payload is empty — no StarIsland.app in IPA"
            exit 1
          fi

          echo "✅ Unsigned IPA ready for sideloading"

      - name: Generate IPA Structure Report
        run: |
          {
            echo "===== APP_PATH ====="
            echo "${{ steps.locate-app.outputs.BUILT_PRODUCTS_DIR }}/StarIsland.app"

            echo ""
            echo "===== Original app size ====="
            du -sh "${{ steps.locate-app.outputs.BUILT_PRODUCTS_DIR }}/StarIsland.app" 2>/dev/null || echo "N/A"

            echo ""
            echo "===== Payload content ====="
            find build/Payload 2>/dev/null | head -50

            echo ""
            echo "===== IPA size ====="
            ls -lh build/StarIsland.ipa 2>/dev/null || echo "N/A"

            echo ""
            echo "===== Payload file list ====="
            unzip -l build/StarIsland.ipa 2>/dev/null | grep Payload | head -50
          } > build/ipa-structure.txt

          echo "ipa-structure.txt written ($(wc -c < build/ipa-structure.txt) bytes)"

      - name: Upload IPA Structure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa-structure
          path: build/ipa-structure.txt
          retention-days: 30

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-release-log
          path: build-release.log
          retention-days: 30

      - name: Upload Unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: StarIsland-IPA
          path: build/StarIsland.ipa
          retention-days: 30
